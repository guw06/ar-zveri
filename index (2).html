<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Зверьки рядом — AR-охота</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

<style>
  :root{
    --ink:#1d1b4b; --paper:#fff8e7; --pink:#ff5c8a; --sun:#ffc83d; --sky:#4cc9f0; --mint:#7be0ad; --r:18px;
    font-family:"Fredoka",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink)}
  #cam{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#000}
  a-scene{position:fixed !important;inset:0;z-index:1}
  .sticker{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);box-shadow:0 4px 0 var(--ink)}

  /* стартовый экран */
  #start{
    position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:18px;padding:28px;text-align:center;
    background:
      radial-gradient(circle at 20% 15%, #ffe28a 0 90px, transparent 91px),
      radial-gradient(circle at 85% 80%, #ff9bb7 0 120px, transparent 121px),
      radial-gradient(circle at 80% 12%, #8fe3f7 0 60px, transparent 61px),
      var(--sky);
  }
  #start h1{margin:0;font-size:clamp(40px,12vw,64px);line-height:.95;font-weight:700;color:var(--paper);
    -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);transform:rotate(-3deg)}
  #start p{margin:0;max-width:30ch;font-size:18px;font-weight:500}
  #startMobs{display:flex;gap:8px;font-size:44px}
  #startMobs span{animation:hop 1.6s ease-in-out infinite}
  #startMobs span:nth-child(2){animation-delay:.2s}
  #startMobs span:nth-child(3){animation-delay:.4s}
  @keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .btn{font:inherit;font-weight:700;font-size:20px;color:var(--ink);cursor:pointer;background:var(--sun);
    border:3px solid var(--ink);border-radius:999px;padding:14px 34px;box-shadow:0 5px 0 var(--ink)}
  .btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
  .btn[disabled]{background:#d9d2bd;color:#7b7660;box-shadow:0 3px 0 #7b7660;border-color:#7b7660}
  #startNote{font-size:14px;opacity:.8}
  #startErr{color:#9d0b3a;font-weight:600;min-height:1.2em}

  /* HUD */
  #hud{position:fixed;inset:0;z-index:20;display:none;pointer-events:none}
  #hud > *{pointer-events:none}
  #hud button, #hud .sticker{pointer-events:auto}
  .top{position:absolute;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 10px);
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  #targetCard{padding:8px 14px;display:flex;align-items:center;gap:10px;min-width:0}
  #targetEmoji{font-size:34px;line-height:1}
  #targetName{font-weight:700;font-size:18px;line-height:1.1}
  #targetDist{font-size:14px;font-weight:500}
  #bagBtn{padding:8px 14px;font:inherit;font-weight:700;font-size:18px;color:var(--ink);cursor:pointer}
  #bagBtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}

  #radarWrap{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 82px);
    width:124px;height:124px;border-radius:50%;padding:0;overflow:hidden}
  #radar{width:100%;height:100%;display:block}

  #navArrow{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 86px);
    width:64px;height:64px;margin-left:-32px;display:flex;align-items:center;justify-content:center;border-radius:50%}
  #navArrow svg{width:40px;height:40px}

  /* прицел */
  #reticle{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;
    border:4px solid rgba(255,248,231,.9);box-shadow:0 0 0 3px var(--ink), inset 0 0 0 3px var(--ink);
    transition:transform .15s, border-color .15s;pointer-events:none !important}
  #reticle.on{border-color:var(--pink);transform:scale(1.18)}

  .bottom{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);
    display:flex;flex-direction:column;align-items:center;gap:10px}
  #hint{padding:7px 16px;font-weight:600;font-size:15px;text-align:center;max-width:86vw}
  #catchBtn{width:92px;height:92px;border-radius:50%;padding:0;cursor:pointer;font:inherit;font-weight:700;font-size:16px;
    color:var(--ink);background:#e9e3cf;border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);
    display:flex;align-items:center;justify-content:center;position:relative}
  #catchBtn::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;background:var(--ink);margin-top:-2px}
  #catchBtn span{position:relative;z-index:1;background:inherit;padding:0 4px;border-radius:8px}
  #catchBtn.ready{background:var(--pink);animation:pulse 1s ease-in-out infinite}
  #catchBtn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  #toast{position:fixed;left:50%;top:38%;z-index:40;transform:translate(-50%,-50%) scale(.6);padding:16px 26px;
    text-align:center;font-weight:700;font-size:22px;opacity:0;pointer-events:none;
    transition:transform .25s cubic-bezier(.3,1.6,.5,1),opacity .2s}
  #toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #toast .big{font-size:56px;display:block;line-height:1.1}

  #bag{position:fixed;inset:0;z-index:45;display:none;background:rgba(29,27,75,.55);align-items:flex-end;justify-content:center}
  #bag.open{display:flex}
  #bagPanel{width:min(560px,100%);max-height:78vh;overflow:auto;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px);
    border-radius:26px 26px 0 0;border-bottom:none}
  #bagPanel h2{margin:0 0 4px;font-size:26px}
  #bagPanel .sub{margin:0 0 14px;font-weight:500}
  #grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .cell{border:3px solid var(--ink);border-radius:14px;padding:10px 4px;text-align:center;background:#fff}
  .cell .e{font-size:38px;line-height:1.1}
  .cell .n{font-size:13px;font-weight:600}
  .cell .c{font-size:12px;font-weight:500;opacity:.75}
  .cell.empty{background:#e9e3cf}
  .cell.empty .e{filter:grayscale(1) brightness(.35);opacity:.6}
  #bagClose{margin-top:16px;width:100%}
  @media (prefers-reduced-motion:reduce){#startMobs span,#catchBtn.ready{animation:none}}
</style>
</head>
<body>

<video id="cam" playsinline muted autoplay></video>

<div id="start">
  <div id="startMobs"><span>🐣</span><span>🦊</span><span>🐙</span></div>
  <h1>Зверьки<br>рядом</h1>
  <p>Наведите камеру и повернитесь вокруг себя: зверьки спрятались рядом. Совместите прицел и поймайте!</p>
  <button class="btn" id="startBtn">Начать охоту</button>
  <div id="startErr"></div>
  <div id="startNote">Нужен доступ к камере. Работает и в помещении, GPS не нужен.</div>
</div>

<div id="hud">
  <div class="top">
    <div id="targetCard" class="sticker">
      <div id="targetEmoji">🔍</div>
      <div>
        <div id="targetName">Ищем…</div>
        <div id="targetDist">повернитесь вокруг</div>
      </div>
    </div>
    <button id="bagBtn" class="sticker">🎒 <span id="bagCount">0</span></button>
  </div>

  <div id="navArrow" class="sticker">
    <svg id="arrowSvg" viewBox="0 0 40 40"><path d="M20 4 L33 32 L20 25 L7 32 Z" fill="#ff5c8a" stroke="#1d1b4b" stroke-width="3" stroke-linejoin="round"/></svg>
  </div>

  <div id="radarWrap" class="sticker"><canvas id="radar" width="248" height="248"></canvas></div>

  <div id="reticle"></div>

  <div class="bottom">
    <div id="hint" class="sticker">Повернитесь вокруг себя</div>
    <button id="catchBtn" disabled><span>Поймать</span></button>
  </div>
</div>

<div id="toast" class="sticker"></div>

<div id="bag">
  <div id="bagPanel" class="sticker">
    <h2>Моя коллекция</h2>
    <p class="sub" id="bagSub"></p>
    <div id="grid"></div>
    <button class="btn" id="bagClose">Назад к охоте</button>
  </div>
</div>

<script>
/* ============ НАСТРОЙКИ ============ */
const CFG = {
  mobCount: 14,       // сколько зверьков вокруг
  distMin: 4,         // ближайшее расстояние, м (виртуальное)
  distMax: 11,        // дальнее расстояние, м
  aimAngle: 14,       // точность прицела, градусов
  radarRange: 12,     // радиус радара, м
  respawnMs: 1200,    // через сколько появляется замена после поимки
  wander: 1           // 1 = зверьки неторопливо ходят по кругу, 0 = стоят
};

const SPECIES = [
  { id:'puhlya',  name:'Пухля',   emoji:'🐣', body:'#ffd84d', belly:'#fff3b0', accent:'#ff9f1c', ears:'round' },
  { id:'iskrik',  name:'Искрик',  emoji:'🦊', body:'#ff8a3d', belly:'#ffe2c4', accent:'#7a2e0e', ears:'point' },
  { id:'bubl',    name:'Бубль',   emoji:'🐙', body:'#b58cff', belly:'#e7dbff', accent:'#6a3fd1', ears:'none'  },
  { id:'oblachko',name:'Облачко', emoji:'☁️', body:'#bfe9ff', belly:'#ffffff', accent:'#4cc9f0', ears:'round' },
  { id:'mshanka', name:'Мшанка',  emoji:'🐸', body:'#7be0ad', belly:'#e4fbe9', accent:'#1f9d63', ears:'none'  },
  { id:'rozik',   name:'Розик',   emoji:'🐷', body:'#ff9bb7', belly:'#ffe0e9', accent:'#e0366b', ears:'point' }
];

/* ============ утилиты ============ */
const $ = id => document.getElementById(id);
const TAU = Math.PI*2;
const wrapPI = a => { a%=TAU; if(a>Math.PI)a-=TAU; if(a<-Math.PI)a+=TAU; return a; };
const CAM_Y = 1.6;

let mobs = [], nextBase = 0, yawS = 0, started = false;
let collection = {};
try { collection = JSON.parse(localStorage.getItem('zveri-bag') || '{}'); } catch(e){}
const saveBag = () => { try { localStorage.setItem('zveri-bag', JSON.stringify(collection)); } catch(e){} };

AFRAME.registerComponent('face-camera', {
  tick(){
    const p = this.el.object3D.position;
    this.el.object3D.rotation.y = Math.atan2(-p.x, -p.z) + Math.PI;   // лицом к игроку
  }
});

/* ============ зверёк ============ */
function buildMobHTML(sp){
  const ears = sp.ears === 'round'
    ? `<a-sphere position="-0.32 0.62 0" radius="0.17" color="${sp.accent}"></a-sphere>
       <a-sphere position="0.32 0.62 0" radius="0.17" color="${sp.accent}"></a-sphere>`
    : sp.ears === 'point'
    ? `<a-cone position="-0.3 0.68 0" radius-bottom="0.17" radius-top="0" height="0.4" color="${sp.accent}" rotation="0 0 12"></a-cone>
       <a-cone position="0.3 0.68 0" radius-bottom="0.17" radius-top="0" height="0.4" color="${sp.accent}" rotation="0 0 -12"></a-cone>`
    : '';
  return `
    <a-entity animation="property: position; dir: alternate; dur: ${600+Math.random()*400|0}; easing: easeInOutSine; loop: true; from: 0 0 0; to: 0 0.22 0">
      <a-sphere radius="0.55" color="${sp.body}" scale="1 0.95 0.9"></a-sphere>
      <a-sphere position="0 -0.12 0.3" radius="0.36" color="${sp.belly}" scale="1 1 0.55"></a-sphere>
      ${ears}
      <a-sphere position="-0.2 0.14 0.43" radius="0.12" color="#ffffff"></a-sphere>
      <a-sphere position="0.2 0.14 0.43" radius="0.12" color="#ffffff"></a-sphere>
      <a-sphere position="-0.2 0.14 0.53" radius="0.06" color="#1d1b4b"></a-sphere>
      <a-sphere position="0.2 0.14 0.53" radius="0.06" color="#1d1b4b"></a-sphere>
      <a-sphere position="-0.36 -0.05 0.38" radius="0.08" color="#ff7a9c" scale="1 .7 .5"></a-sphere>
      <a-sphere position="0.36 -0.05 0.38" radius="0.08" color="#ff7a9c" scale="1 .7 .5"></a-sphere>
      <a-torus position="0 -0.02 0.5" radius="0.07" radius-tubular="0.012" arc="180" rotation="0 0 180" color="#1d1b4b"></a-torus>
      <a-sphere position="-0.26 -0.52 0.1" radius="0.15" color="${sp.accent}"></a-sphere>
      <a-sphere position="0.26 -0.52 0.1" radius="0.15" color="${sp.accent}"></a-sphere>
    </a-entity>`;
}

function spawnMob(){
  const sp = SPECIES[Math.floor(Math.random()*SPECIES.length)];
  // равномерно по кругу + небольшой разброс, чтобы они были со всех сторон
  const a = (nextBase++ * (TAU/CFG.mobCount)) + (Math.random()-.5)*0.35;
  const d = CFG.distMin + Math.random()*(CFG.distMax-CFG.distMin);
  const el = document.createElement('a-entity');
  el.setAttribute('face-camera','');
  const s = 0.9 + d*0.12;
  el.setAttribute('scale', `${s} ${s} ${s}`);
  el.innerHTML = buildMobHTML(sp);
  $('scene').appendChild(el);
  mobs.push({
    sp, el, a, d,
    wa: (Math.random()<.5?-1:1)*(0.04+Math.random()*0.10)*CFG.wander,
    ph: Math.random()*TAU,
    y: 0.9 + Math.random()*1.3,
    // вычисляемые каждый кадр:
    aa:a, dd:d, aim:99
  });
}
function fillMobs(){ while(mobs.length < CFG.mobCount) spawnMob(); }

/* ============ радар ============ */
const radar = $('radar'), rctx = radar.getContext('2d');
function drawRadar(){
  const W = radar.width, C = W/2, rad = C-8;
  rctx.clearRect(0,0,W,W);
  rctx.fillStyle = '#fff8e7'; rctx.fillRect(0,0,W,W);
  rctx.strokeStyle = '#1d1b4b'; rctx.lineWidth = 2; rctx.globalAlpha = .22;
  for(const k of [1,.66,.33]){ rctx.beginPath(); rctx.arc(C,C,rad*k,0,7); rctx.stroke(); }
  rctx.beginPath(); rctx.moveTo(C-rad,C); rctx.lineTo(C+rad,C); rctx.moveTo(C,C-rad); rctx.lineTo(C,C+rad); rctx.stroke();
  rctx.globalAlpha = 1;
  // сектор обзора камеры (вверх = куда смотрим)
  rctx.fillStyle = 'rgba(76,201,240,.5)';
  rctx.beginPath(); rctx.moveTo(C,C);
  rctx.arc(C,C,rad,-Math.PI/2-0.5,-Math.PI/2+0.5); rctx.closePath(); rctx.fill();
  for(const m of mobs){
    const a = m.aa - yawS - Math.PI/2;
    const r = Math.min(m.dd, CFG.radarRange)/CFG.radarRange*rad;
    const x = C + Math.cos(a)*r, y = C + Math.sin(a)*r;
    rctx.fillStyle = m.aim <= CFG.aimAngle ? '#ff5c8a' : '#ffc83d';
    rctx.strokeStyle = '#1d1b4b'; rctx.lineWidth = 3;
    rctx.beginPath(); rctx.arc(x,y,9,0,7); rctx.fill(); rctx.stroke();
  }
  rctx.fillStyle = '#1d1b4b';
  rctx.beginPath(); rctx.arc(C,C,8,0,7); rctx.fill();
}

/* ============ главный цикл (каждый кадр) ============ */
const _v = new THREE.Vector3(), _p = new THREE.Vector3();
let arrowA = 0, lastT = performance.now();

function loop(now){
  requestAnimationFrame(loop);
  const sceneEl = $('scene');
  if(!started || !sceneEl || !sceneEl.camera) return;
  const dt = Math.min(0.1,(now-lastT)/1000); lastT = now;
  const t = now/1000;

  // куда смотрит камера
  sceneEl.camera.getWorldDirection(_v);
  const yaw = Math.atan2(_v.x, -_v.z);
  yawS = wrapPI(yawS + wrapPI(yaw - yawS)*Math.min(1, dt*14));   // сглаживание

  let nearest = null, aimed = null;
  for(const m of mobs){
    m.aa = m.a + t*m.wa;
    m.dd = m.d + Math.sin(t*0.45 + m.ph)*0.7;
    const x = Math.sin(m.aa)*m.dd, z = -Math.cos(m.aa)*m.dd;
    m.el.object3D.position.set(x, m.y, z);

    _p.set(x, m.y-CAM_Y, z).normalize();
    m.aim = Math.acos(Math.max(-1, Math.min(1, _p.dot(_v)))) * 180/Math.PI;
    if(!nearest || m.dd < nearest.dd) nearest = m;
    if(m.aim <= CFG.aimAngle && (!aimed || m.aim < aimed.aim)) aimed = m;
  }

  const shown = aimed || nearest;
  if(shown){
    $('targetEmoji').textContent = shown.sp.emoji;
    $('targetName').textContent = shown.sp.name;
    $('targetDist').textContent = `${shown.dd.toFixed(1)} м`;
    const diff = wrapPI(shown.aa - yawS);
    arrowA += wrapPI(diff - arrowA)*Math.min(1, dt*12);
    $('arrowSvg').style.transform = `rotate(${arrowA*180/Math.PI}deg)`;
    $('hint').textContent = aimed ? `Лови ${aimed.sp.name}!`
      : (Math.abs(diff) > 0.35 ? (diff > 0 ? 'Повернитесь вправо ➜' : '⬅ Повернитесь влево') : 'Наведите прицел на зверька');
  }
  const btn = $('catchBtn');
  btn.disabled = !aimed; btn.classList.toggle('ready', !!aimed);
  $('reticle').classList.toggle('on', !!aimed);
  drawRadar();
}

/* ============ поимка ============ */
function catchAimed(){
  let best = null;
  for(const m of mobs) if(m.aim <= CFG.aimAngle && (!best || m.aim < best.aim)) best = m;
  if(!best) return;
  collection[best.sp.id] = (collection[best.sp.id]||0) + 1;
  saveBag(); updateBagCount();
  if(navigator.vibrate) navigator.vibrate([40,40,80]);
  best.el.setAttribute('animation__out','property: scale; to: 0 0 0; dur: 350; easing: easeInBack');
  const el = best.el; setTimeout(()=>el.remove(), 380);
  mobs = mobs.filter(m => m !== best);
  const isNew = collection[best.sp.id] === 1;
  showToast(`<span class="big">${best.sp.emoji}</span>${best.sp.name} пойман!${isNew ? '<br><small>Новый в коллекции</small>' : ''}`);
  setTimeout(()=>{ if(mobs.length < CFG.mobCount) spawnMob(); }, CFG.respawnMs);
}

let toastTimer;
function showToast(html){
  const t = $('toast'); t.innerHTML = html; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

/* ============ коллекция ============ */
function updateBagCount(){ $('bagCount').textContent = Object.values(collection).reduce((a,b)=>a+b,0); }
function openBag(){
  const got = SPECIES.filter(s => collection[s.id]).length;
  $('bagSub').textContent = `Открыто видов: ${got} из ${SPECIES.length}`;
  $('grid').innerHTML = SPECIES.map(s => {
    const n = collection[s.id] || 0;
    return `<div class="cell ${n?'':'empty'}"><div class="e">${s.emoji}</div>
      <div class="n">${n ? s.name : '???'}</div><div class="c">${n ? 'поймано: '+n : 'не найден'}</div></div>`;
  }).join('');
  $('bag').classList.add('open');
}

/* ============ старт ============ */
async function start(){
  const err = $('startErr'); err.textContent = '';
  $('startBtn').disabled = true;

  // 1. датчики ориентации (iPhone просит разрешение по тапу)
  try{
    if(typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'){
      const r = await DeviceOrientationEvent.requestPermission();
      if(r !== 'granted') throw new Error('Нет доступа к датчикам. Настройки → Safari → «Движение и ориентация» → включить.');
    }
  }catch(e){ err.textContent = e.message; $('startBtn').disabled = false; return; }

  // 2. камера
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } }, audio:false });
    const v = $('cam'); v.srcObject = stream; await v.play();
  }catch(e){
    err.textContent = `Камера не включилась [${e.name}]. Разрешите доступ к камере для сайта и нажмите снова.`;
    $('startBtn').disabled = false; return;
  }
  launchScene();
}

function launchScene(){
  const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1);
  const scene = document.createElement('a-scene');
  scene.id = 'scene';
  scene.setAttribute('vr-mode-ui','enabled: false');
  scene.setAttribute('renderer','alpha: true; antialias: true');
  scene.setAttribute('embedded','');
  scene.innerHTML = `
    <a-camera position="0 ${CAM_Y} 0" wasd-controls="enabled: false"
      look-controls="magicWindowTrackingEnabled: true; touchEnabled: ${mobile?'false':'true'}; mouseEnabled: ${mobile?'false':'true'}; reverseMouseDrag: false"></a-camera>
    <a-entity light="type: ambient; intensity: 1.15"></a-entity>
    <a-entity light="type: directional; intensity: .8" position="1 3 2"></a-entity>`;
  document.body.prepend(scene);
  scene.addEventListener('loaded', () => { fillMobs(); started = true; });
  $('start').style.display = 'none';
  $('hud').style.display = 'block';
  updateBagCount();
}

$('startBtn').addEventListener('click', start);
$('catchBtn').addEventListener('click', catchAimed);
$('bagBtn').addEventListener('click', openBag);
